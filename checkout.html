<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanh toán | Công ty HT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* --- STYLE HỆ THỐNG (ĐỒNG BỘ) --- */
:root {
    --primary: #0d6efd;
    --dark: #1e293b;
    --text: #475569;
    --bg: #f8fafc;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif}
body{background: var(--bg); color: var(--text)}

/* --- HEADER & NAV --- */
header{
    background:#fff; padding:15px 8%;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 2px 10px rgba(0,0,0,.03);
    position:sticky; top:0; z-index:99;
}
.logo{display:flex; align-items:center; gap:12px}
.logo img{width:50px; border-radius:8px}
.logo b{font-size: 20px; color: var(--primary); letter-spacing: 1px}

nav{ background: #fff; border-bottom: 1px solid #e2e8f0; padding:0 8%; }
nav ul{display:flex; list-style:none;}
nav a{ color: var(--text); padding: 15px 20px; display: block; font-weight: 600; font-size: 14px; text-decoration:none}

/* --- LAYOUT --- */
.checkout-container {
    display: grid;
    grid-template-columns: 1fr 400px;
    gap: 30px;
    padding: 40px 8%;
}
.box { background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,.05); margin-bottom: 25px; }
.box h3 { margin-bottom: 20px; color: var(--dark); border-left: 4px solid var(--primary); padding-left: 15px; }

/* --- FORM --- */
.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; outline: none; background: #f8fafc; }

/* --- PAYMENT --- */
.payment-methods { display: flex; gap: 15px; margin-top: 10px; }
.method {
    flex: 1; border: 2px solid #e2e8f0; padding: 15px; border-radius: 12px;
    text-align: center; cursor: pointer; transition: 0.3s;
}
.method.active { border-color: var(--primary); color: var(--primary); background: rgba(13,110,253,0.05); }

/* --- SUMMARY --- */
.summary-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
.total { font-size: 20px; font-weight: 800; color: #e53935; margin-top: 15px; display: flex; justify-content: space-between; }
.btn-order {
    width: 100%; padding: 15px; background: var(--primary); color: #fff;
    border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 20px;
}

/* --- SUCCESS MODAL --- */
#successModal {
    position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6);
    display:none; align-items:center; justify-content:center; z-index:1000;
}
.modal-content { background:#fff; padding:40px; border-radius:20px; text-align:center; max-width:400px; }

@media(max-width: 900px) { .checkout-container { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
    <div class="logo">
        <img src="https://down-tx-vn.img.susercontent.com/vn-11134216-820l4-mhlgubgk8em9de_tn.webp">
        <b>HT STORE</b>
    </div>
</header>

<nav>
    <ul>
        <li><a href="index.html">Trang chủ</a></li>
        <li><a href="products.html">Sản phẩm</a></li>
    </ul>
</nav>

<div class="checkout-container">
    <div>
        <div class="box">
            <h3>Thông tin giao hàng</h3>
            <div class="form-group">
                <label>Họ tên</label>
                <input type="text" id="name" placeholder="Nguyễn Văn A">
            </div>
            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="text" id="phone" placeholder="090xxxxxxx">
            </div>
            <div class="form-group">
                <label>Địa chỉ</label>
                <input type="text" id="address" placeholder="Số nhà, tên đường...">
            </div>
        </div>

        <div class="box">
            <h3>Phương thức thanh toán</h3>
            <div class="payment-methods">
                <div class="method active" onclick="setPayment('COD', this)">
                    <i class="fa fa-truck"></i><br>Tiền mặt (COD)
                </div>
                <div class="method" onclick="setPayment('Banking', this)">
                    <i class="fa fa-university"></i><br>Chuyển khoản
                </div>
            </div>
        </div>
    </div>

    <div class="box" style="height: fit-content;">
        <h3>Đơn hàng của bạn</h3>
        <div id="orderItems">
            <!-- Sản phẩm sẽ hiển thị ở đây -->
        </div>
        <div class="total">
            <span>Tổng cộng:</span>
            <span id="finalTotal">0đ</span>
        </div>
        <button class="btn-order" onclick="processOrder()">XÁC NHẬN ĐẶT HÀNG</button>
    </div>
</div>

<div id="successModal">
    <div class="modal-content">
        <i class="fa fa-check-circle" style="color:#22c55e; font-size:60px"></i>
        <h2 style="margin:15px 0">Đặt hàng thành công!</h2>
        <p>Đơn hàng của bạn đang được xử lý.</p>
        <br>
        <a href="index.html" style="color:var(--primary); font-weight:600; text-decoration:none">Quay về trang chủ</a>
    </div>
</div>

<script>
let selectedPayment = "COD";

// Hàm hỗ trợ lấy giá trị an toàn (xử lý cả tiếng Anh và tiếng Việt)
function getValue(item, keyEN, keyVN) {
    return item[keyEN] || item[keyVN] || 0;
}

function renderSummary() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    const container = document.getElementById("orderItems");
    let total = 0;

    if (cart.length === 0) {
        container.innerHTML = "<p style='text-align:center; padding:20px'>Giỏ hàng trống</p>";
        document.getElementById("finalTotal").innerText = "0đ";
        return;
    }

    container.innerHTML = cart.map(item => {
        // Kiểm tra tất cả các trường hợp tên thuộc tính có thể xảy ra
        const price = item.price || item.gia || 0;
        const quantity = item.quantity || item.soluong || 1;
        const name = item.name || item.tensp || "Sản phẩm không tên";
        
        const itemTotal = price * quantity;
        total += itemTotal;

        return `
            <div class="summary-item">
                <span style="max-width: 200px">${name} (x${quantity})</span>
                <span style="font-weight:600">${itemTotal.toLocaleString()}đ</span>
            </div>
        `;
    }).join('');

    document.getElementById("finalTotal").innerText = total.toLocaleString() + "đ";
}

function setPayment(method, element) {
    selectedPayment = method;
    document.querySelectorAll('.method').forEach(m => m.classList.remove('active'));
    element.classList.add('active');
}

function processOrder() {
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim();
    const cart = JSON.parse(localStorage.getItem("cart")) || [];

    if(!name || !phone || !address) {
        alert("Vui lòng điền đầy đủ thông tin giao hàng!");
        return;
    }
    if(cart.length === 0) {
        alert("Giỏ hàng của bạn đang trống!");
        return;
    }

    // Tính tổng tiền[cite: 10]
    const totalAmount = cart.reduce((sum, item) => {
        const p = item.price || item.gia || 0;
        const q = item.quantity || item.soluong || 1;
        return sum + (p * q);
    }, 0);

    const orders = JSON.parse(localStorage.getItem("orders")) || [];
    const newOrder = {
        orderId: "HT" + Date.now(),
        customer: { name, phone, address },
        items: cart,
        total: totalAmount,
        payment: selectedPayment,
        date: new Date().toLocaleString(),
        status: "Chờ xác nhận"
    };

    orders.push(newOrder);
    localStorage.setItem("orders", JSON.stringify(orders)); // Lưu đơn[cite: 10]
    localStorage.removeItem("cart"); // Xóa giỏ hàng[cite: 10]

    document.getElementById("successModal").style.display = "flex";
}

// Chạy hàm khi trang tải xong[cite: 10]
window.onload = renderSummary;
</script>
</body>
</html>
